<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgGrad1)"/>

  <!-- Browser Window Mockup -->
  <g filter="url(#shadow1)">
    <rect x="60" y="45" width="480" height="250" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <!-- Window Bar -->
    <rect x="60" y="45" width="480" height="36" rx="10" fill="#f8fafc"/>
    <path d="M60 70 L540 70" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="82" cy="63" r="5" fill="#f87171"/>
    <circle cx="98" cy="63" r="5" fill="#fbbf24"/>
    <circle cx="114" cy="63" r="5" fill="#34d399"/>
    <!-- Address bar mockup -->
    <rect x="140" y="54" width="220" height="18" rx="4" fill="#e2e8f0"/>

    <!-- Content mockup -->
    <!-- Header banner -->
    <rect x="85" y="95" width="430" height="42" rx="6" fill="#818cf8" fill-opacity="0.2"/>
    <rect x="105" y="107" width="160" height="18" rx="4" fill="#6366f1"/>

    <!-- Left column: code block -->
    <rect x="85" y="150" width="230" height="120" rx="6" fill="#0f172a"/>
    <rect x="100" y="165" width="80" height="8" rx="3" fill="#38bdf8"/>
    <rect x="100" y="182" width="130" height="8" rx="3" fill="#a78bfa"/>
    <rect x="115" y="199" width="100" height="8" rx="3" fill="#34d399"/>
    <rect x="115" y="216" width="140" height="8" rx="3" fill="#f472b6"/>
    <rect x="100" y="233" width="60" height="8" rx="3" fill="#fbbf24"/>

    <!-- Right column: cards -->
    <rect x="330" y="150" width="185" height="55" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="345" y="165" width="110" height="10" rx="3" fill="#64748b"/>
    <rect x="345" y="182" width="140" height="8" rx="3" fill="#94a3b8"/>

    <rect x="330" y="215" width="185" height="55" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="345" y="230" width="120" height="10" rx="3" fill="#64748b"/>
    <rect x="345" y="247" width="90" height="8" rx="3" fill="#94a3b8"/>
  </g>
</svg>
